<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweden terminal</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2a3340; --text: #e6edf3; --muted: #8b98a8;
    --dip: #d29922; --zone: #e8743b; --bounce: #3fb5e8; --entry: #2ea043; --dead: #6e7681; --danger: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,17,23,.96); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  .status { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dead); margin-right: 6px; }
  .dot.live { background: var(--entry); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  button, .chip { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                  padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.on, .chip.on { border-color: var(--accent); color: var(--accent); }
  button.warn { border-color: var(--zone); color: var(--zone); }
  main { padding: 12px 16px 40px; max-width: 1400px; margin: 0 auto; }
  .rules { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex;
          flex-direction: column; gap: 8px; min-width: 0; }
  .card.stage-entry { border-color: var(--entry); box-shadow: 0 0 0 1px var(--entry) inset; }
  .card.hidden { opacity: .55; }
  .top { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .img { width: 48px; height: 48px; border-radius: 10px; background: var(--panel2); object-fit: cover; flex: none; }
  .title { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sym { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; text-transform: uppercase;
           letter-spacing: .4px; flex: none; color: #0d1117; }
  .b-dip { background: var(--dip); } .b-zone { background: var(--zone); } .b-bounce { background: var(--bounce); }
  .b-entry { background: var(--entry); } .b-dead, .b-top { background: var(--dead); }
  .b-mayhem { background: #a371f7; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .stat .k { color: var(--muted); font-size: 11px; }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .neg { color: var(--danger); }
  svg.chart { width: 100%; height: 90px; display: block; background: var(--panel2); border-radius: 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
  .checks b { color: var(--text); font-weight: 600; }
  .desc { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
          overflow: hidden; }
  .ca { display: flex; gap: 8px; align-items: center; }
  .ca button { flex: 1; background: var(--accent); color: #0d1117; border: 0; border-radius: 10px; padding: 12px;
               font-weight: 700; font-size: 15px; }
  .ca button.done { background: var(--entry); }
  .ca code { color: var(--muted); font-size: 12px; }
  .top [data-copy] { cursor: pointer; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a, .links button { font-size: 12px; padding: 5px 8px; border-radius: 7px; background: var(--panel2);
                            border: 1px solid var(--line); color: var(--accent); text-decoration: none; }
  .hiddenwhy { color: var(--zone); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #log { margin-top: 24px; color: var(--muted); font-size: 12px; }
  #log div { padding: 2px 0; border-bottom: 1px solid var(--line); }
  #log [data-copy] { cursor: pointer; }
  #latest { display: none; position: sticky; top: var(--hh, 52px); z-index: 4; margin: 0 -16px 12px; padding: 8px 16px;
            background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; }
  #latest.show { display: flex; }
  #latest .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  #latest button { flex: none; background: var(--accent); color: #0d1117; border: 0; border-radius: 10px;
                   padding: 10px 14px; font-weight: 700; font-size: 15px; }
  #latest button.done { background: var(--entry); }
  #login { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; align-items: center;
           justify-content: center; padding: 16px; }
  #login.show { display: flex; }
  #login form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  #login input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                 padding: 14px; font-size: 20px; text-align: center; letter-spacing: 3px; }
  #login button { background: var(--accent); color: #0d1117; border: 0; border-radius: 10px; padding: 14px;
                  font-weight: 700; font-size: 16px; }
  #ax { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.6); display: none; align-items: flex-end;
        justify-content: center; }
  #ax.show { display: flex; }
  #ax form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 16px;
             width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  .axgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .axgrid label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  .axgrid input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                  padding: 10px; font-size: 16px; }
  .axrow { display: flex; gap: 8px; } .axrow button { flex: 1; padding: 12px; font-weight: 700; }
  .axrow button[type=submit] { background: var(--accent); color: #0d1117; border: 0; }
  .axbtn { padding: 2px 8px; font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9; background: var(--entry);
           color: #0d1117; font-weight: 700; padding: 10px 16px; border-radius: 10px; display: none; }
  #toast.show { display: block; }
  #loginmsg { color: var(--danger); min-height: 1.4em; font-size: 13px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>🇸🇪 Sweden terminal</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
  <div class="controls">
    <button id="sound" class="warn">🔇 Enable sound</button>
    <button data-f="all" class="on">All</button>
    <button data-f="entry">Entry</button>
    <button data-f="bounce">Bounce</button>
    <button data-f="zone">Zone</button>
    <button data-f="dip">Dip</button>
    <button id="showall">Show hidden</button>
    <button id="lock">🔒 Lock</button>
  </div>
</header>
<div id="toast"></div>
<div id="ax"><form id="axform" autocomplete="off">
  <b id="axtitle"></b>
  <div class="axgrid">
    <label>Top 10 %<input name="top10" inputmode="decimal"></label><label>Dev %<input name="dev" inputmode="decimal"></label>
    <label>Snipers %<input name="snipers" inputmode="decimal"></label><label>Insiders %<input name="insiders" inputmode="decimal"></label>
    <label>Bundlers %<input name="bundlers" inputmode="decimal"></label><label>Holders<input name="holders" inputmode="numeric"></label>
  </div>
  <div class="axrow"><button type="button" id="axcancel">Cancel</button><button type="submit">Save</button></div>
</form></div>
<div id="login"><form id="loginform" autocomplete="off">
  <h1>🇸🇪 Sweden terminal</h1>
  <input id="pk" type="password" inputmode="text" autocomplete="current-password" placeholder="Passkey" aria-label="Passkey">
  <button type="submit">Unlock</button>
  <div id="loginmsg"></div>
</form></div>
<main>
  <div id="latest"><div class="t" id="latesttext"></div><button id="latestcopy">Copy CA</button></div>
  <p class="rules" id="rules"></p>
  <div class="grid" id="grid"></div>
  <div id="log"></div>
</main>
<script>
const ORDER = { entry: 0, bounce: 1, zone: 2, dip: 3, top: 4, dead: 5 };
const LABEL = { entry: "Entry", bounce: "Bounce", zone: "In zone", dip: "Dip", top: "Near top", dead: "Dead" };
let filter = "all", showAll = false, soundOn = false, audio = null, lastAlert = null, state = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const usd = (x) => !x ? "–" : x >= 1e6 ? "$" + (x / 1e6).toFixed(2) + "M" : "$" + (x / 1e3).toFixed(1) + "k";
const dur = (m) => m < 60 ? Math.round(m) + "m" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m";
const secs = (s) => s == null ? "–" : s < 60 ? Math.round(s) + "s" : dur(s / 60);
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : (u && /^ipfs:\/\//i.test(u) ? "https://ipfs.io/ipfs/" + u.slice(7) : "");
const xUrl = (t) => !t ? "" : /^https?:/i.test(t) ? t : "https://x.com/" + t.replace(/^@/, "");

function chart(c) {
  const p = c.pts; if (!p || p.length < 2) return '<svg class="chart"></svg>';
  const W = 300, H = 90, xs = p.map((q) => q[0]), ys = p.map((q) => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(...ys, c.low ?? Infinity), y1 = Math.max(...ys, c.peak);
  const X = (x) => ((x - x0) / ((x1 - x0) || 1)) * (W - 8) + 4, Y = (y) => H - 6 - ((y - y0) / ((y1 - y0) || 1)) * (H - 12);
  const path = p.map((q, i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join(" ");
  const col = getComputedStyle(document.documentElement).getPropertyValue("--" + (c.stage === "top" ? "dead" : c.stage)).trim();
  let lines = `<line x1="4" x2="${W - 4}" y1="${Y(c.peak)}" y2="${Y(c.peak)}" stroke="#8b98a8" stroke-dasharray="3 3" stroke-width="1"/>`;
  if (c.low) lines += `<line x1="4" x2="${W - 4}" y1="${Y(c.low)}" y2="${Y(c.low)}" stroke="#e8743b" stroke-dasharray="3 3" stroke-width="1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}<path d="${path}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

function liveLine(c) {
  const l = c.live; if (!l) return "";
  return `<div class="checks"><span>live:</span><span>top10 <b>${pct(l.top10)}</b></span><span>dev <b>${pct(l.dev, 1)}</b></span>
    <span>bundle L/2+/4+ <b>${pct(l.bundle_launch)}</b>/<b>${pct(l.bundle_2)}</b>/<b>${pct(l.bundle_4)}</b></span>
    <span>snipers <b>${pct(l.snipers_1_3)}</b>/<b>${pct(l.snipers_0_10)}</b></span><span>holders <b>${l.holders}</b></span>
    <button class="axbtn" data-ax="${esc(c.mint)}" data-sym="${esc(c.sym)}">Axiom ✎</button></div>`;
}

function card(c) {
  const m = c.meta || {}, img = safeUrl(m.image), ch = c.checks || {};
  const badges = `<span class="badge b-${c.stage}">${LABEL[c.stage]}</span>` + (c.mayhem ? ' <span class="badge b-mayhem">Mayhem</span>' : "");
  const links = [
    ["pump.fun", "https://pump.fun/coin/" + c.mint], ["DexScreener", "https://dexscreener.com/solana/" + c.mint],
    ["Bubblemaps", "https://app.bubblemaps.io/sol/token/" + c.mint], ["X search", "https://x.com/search?f=live&q=" + c.mint],
    ["Solscan", "https://solscan.io/token/" + c.mint],
  ];
  if (m.twitter) links.push(["Twitter", xUrl(m.twitter)]);
  if (m.telegram && safeUrl(m.telegram)) links.push(["Telegram", safeUrl(m.telegram)]);
  if (m.website && safeUrl(m.website)) links.push(["Website", safeUrl(m.website)]);
  return `<div class="card stage-${c.stage}${c.visible ? "" : " hidden"}">
    <div class="top">${img ? `<img class="img" data-copy="${esc(c.mint)}" src="${esc(img)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : `<div class="img" data-copy="${esc(c.mint)}"></div>`}
      <div class="title" data-copy="${esc(c.mint)}"><div class="name">${esc(c.name)}</div><div class="sym">$${esc(c.sym)}</div></div>${badges}</div>
    <div class="ca"><button data-copy="${esc(c.mint)}" data-big="1">Copy CA</button><code>${esc(c.mint.slice(0, 4))}…${esc(c.mint.slice(-4))}</code></div>
    ${c.visible ? "" : `<div class="hiddenwhy">hidden: ${esc(c.hidden)}</div>`}
    <div class="stats">
      <div class="stat"><div class="k">Mcap</div><div class="v">${usd(c.mcap_usd)}</div></div>
      <div class="stat"><div class="k">From top</div><div class="v neg">−${pct(c.dd)}</div></div>
      <div class="stat"><div class="k">From low</div><div class="v">${c.from_low == null ? "–" : "+" + pct(c.from_low)}</div></div>
      <div class="stat"><div class="k">Age</div><div class="v">${dur(c.age_min)}</div></div>
    </div>
    ${chart(c)}
    <div class="checks"><span>top10 <b>${pct(ch.top10)}</b></span><span>bundle <b>${pct(ch.bundle)}</b></span>
      <span>snipers <b>${pct(ch.snipers)}</b></span><span>top3 trades <b>${pct(ch.top3_trades)}</b></span>
      <span>creator launches 24h <b>${ch.prior ?? "–"}</b></span><span>dev sold <b>${ch.dev_sold ? "yes" : "no"}</b></span>
      <span>last trade <b>${secs(c.last_trade_s)} ago</b></span></div>
    ${liveLine(c)}
    ${m.description ? `<div class="desc">${esc(m.description)}</div>` : ""}
    <div class="links">${links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`).join("")}
</div>
  </div>`;
}

function render() {
  if (!state) return;
  const s = state.settings;
  $("#rules").textContent = `Graduated pump.fun coins ≤ ${s.max_age_h} h old, passing the on-chain checks (bundle ≤ ${pct(s.bundle_max)}), mcap ≤ $${(s.max_mcap_usd / 1000).toFixed(0)}k, at least ${pct(s.show_dd)} below their top. ` +
    `Zone ${pct(s.dd_min)}–${pct(s.dd_max)} down · bounce +${pct(s.bounce)} off the low · entry after a ${pct(s.pullback)} pullback. SOL $${state.sol_usd.toFixed(0)}.`;
  let cs = state.coins.filter((c) => filter === "all" || c.stage === filter);
  cs.sort((a, b) => (b.visible - a.visible) || (ORDER[a.stage] - ORDER[b.stage]) || (a.age_min - b.age_min));
  $("#grid").innerHTML = cs.length ? cs.map(card).join("") : '<div class="empty">No coin matches right now. Waiting for graduates that dip…</div>';
  $("#log").innerHTML = "<b>Alerts</b> (tap one to copy its CA)" + state.alerts.slice(-15).reverse().map((a) =>
    `<div data-copy="${esc(a.mint)}">${new Date(a.ts * 1000).toLocaleTimeString()} · ${a.kind === "entry" ? "🟢" : "🔔"} ${esc(a.text)}</div>`).join("");
  const last = state.alerts[state.alerts.length - 1];
  $("#latest").classList.toggle("show", !!last);
  if (last) {
    $("#latesttext").textContent = `${new Date(last.ts * 1000).toLocaleTimeString()} · ${last.kind === "entry" ? "🟢" : "🔔"} ${last.text}`;
    $("#latestcopy").dataset.copy = last.mint;
  }
}

function beep(kind) {
  if (!soundOn || !audio) return;
  const notes = kind === "entry" ? [660, 880, 1100] : [520, 660];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.18;
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.start(t); o.stop(t + 0.17);
  });
}

function handleAlerts() {
  const as = state.alerts;
  const maxId = as.length ? as[as.length - 1].id : 0;
  if (lastAlert === null) { lastAlert = maxId; return; }
  const fresh = as.filter((a) => a.id > lastAlert);
  lastAlert = Math.max(lastAlert, maxId);
  if (!fresh.length) return;
  beep(fresh.some((a) => a.kind === "entry") ? "entry" : "new");
  if ("Notification" in window && Notification.permission === "granted")
    fresh.forEach((a) => new Notification(a.kind === "entry" ? "Entry signal" : "New coin to check", { body: a.text }));
  document.title = "(" + fresh.length + ") Sweden terminal";
  setTimeout(() => (document.title = "Sweden terminal"), 8000);
}

let token = null;
try { token = localStorage.getItem("swedenToken"); } catch (e) {}
function showLogin(msg) {
  $("#login").classList.add("show"); $("#loginmsg").textContent = msg || ""; $("#pk").focus();
}
$("#loginform").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ passkey: $("#pk").value }) });
    const j = await r.json();
    if (r.ok && j.token) {
      token = j.token; try { localStorage.setItem("swedenToken", token); } catch (e) {}
      $("#pk").value = ""; $("#login").classList.remove("show"); tick();
    } else showLogin(j.error === "locked" ? `Too many wrong tries - wait ${j.wait} s` :
                     "Wrong passkey" + (j.wait ? ` - locked for ${j.wait} s` : ""));
  } catch (e) { showLogin("No connection to the terminal"); }
};
$("#lock").onclick = () => {
  token = null; try { localStorage.removeItem("swedenToken"); } catch (e) {}
  state = null; $("#grid").innerHTML = ""; $("#log").innerHTML = ""; $("#latest").classList.remove("show"); showLogin();
};

async function tick() {
  if (!token) return showLogin();
  try {
    const r = await fetch("/api/state" + (showAll ? "?all=1" : ""), { cache: "no-store", headers: { "X-Sweden-Token": token } });
    if (r.status === 401) { token = null; try { localStorage.removeItem("swedenToken"); } catch (e) {} return showLogin("Please enter the passkey"); }
    state = await r.json();
    $("#dot").className = "dot" + (state.live ? " live" : "");
    const n = state.coins.filter((c) => c.visible).length;
    $("#status").textContent = (state.live ? "live" : "loading history…") + " · " + n + " coin" + (n === 1 ? "" : "s") + " shown · " + new Date().toLocaleTimeString();
    handleAlerts(); render();
  } catch (e) {
    $("#dot").className = "dot"; $("#status").textContent = "no connection to the terminal";
  }
}

let axMint = null;
document.addEventListener("click", (e) => {
  const ax = e.target.closest("[data-ax]");
  if (ax) { axMint = ax.dataset.ax; $("#axform").reset(); $("#axtitle").textContent = "What Axiom shows for $" + ax.dataset.sym + " right now";
            $("#ax").classList.add("show"); return; }
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach((b) => b.classList.toggle("on", b === f)); render(); }
  const cp = e.target.closest("[data-copy]");
  if (cp && cp.dataset.copy) copyCA(cp.dataset.copy, cp.id === "latestcopy" ? cp : cp.closest(".card")?.querySelector("[data-big]"));
});
function copyCA(t, btn) {
  const done = () => { const ts = $("#toast"); ts.textContent = "CA copied: " + t.slice(0, 4) + "…" + t.slice(-4);
    ts.classList.add("show"); clearTimeout(ts._t); ts._t = setTimeout(() => ts.classList.remove("show"), 1500);
    if (btn) { btn.textContent = "Copied ✓"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Copy CA"; btn.classList.remove("done"); }, 1500); } };
  const fallback = () => {                       // older browsers / plain http
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand("copy"); done(); } catch (e) { prompt("Copy the CA:", t); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
$("#axcancel").onclick = () => $("#ax").classList.remove("show");
$("#axform").onsubmit = async (e) => {
  e.preventDefault();
  const values = {}; new FormData(e.target).forEach((v, k) => { v = String(v).replace(",", ".").replace("%", "").trim(); if (v) values[k] = v; });
  const ts = $("#toast");
  try {
    const r = await fetch("/api/axiom", { method: "POST", headers: { "Content-Type": "application/json", "X-Sweden-Token": token },
                                          body: JSON.stringify({ mint: axMint, values }) });
    ts.textContent = r.ok ? "Saved - thanks" : "Not saved (empty or coin gone)";
  } catch (err) { ts.textContent = "No connection"; }
  ts.classList.add("show"); clearTimeout(ts._t); ts._t = setTimeout(() => ts.classList.remove("show"), 1500);
  $("#ax").classList.remove("show");
};
$("#showall").onclick = (e) => { showAll = !showAll; e.target.classList.toggle("on", showAll); tick(); };
$("#sound").onclick = (e) => {
  soundOn = !soundOn;
  if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  e.target.textContent = soundOn ? "🔔 Sound on" : "🔇 Enable sound";
  e.target.classList.toggle("warn", !soundOn); e.target.classList.toggle("on", soundOn);
  if (soundOn) beep("new");
};
const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
setHH(); addEventListener("resize", setHH);
tick(); setInterval(tick, 3000);
