<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Sweden terminal</title>
<style>
  :root {
    --bg: #07080c; --panel: #0f1117; --panel2: #161923; --panel3: #1d2130; --line: #222634; --text: #e9ecf5;
    --muted: #7d8396; --faint: #4b5063; --green: #2fe3ac; --red: #ec397a; --blue: #526fff; --yellow: #f5c249;
    --orange: #ff8a3d; --cyan: #3fc8ff; --purple: #a78bfa;
    --dip: var(--yellow); --zone: var(--orange); --bounce: var(--cyan); --entry: var(--green); --top: var(--muted); --dead: var(--faint);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh;
         background: radial-gradient(1100px 420px at 50% -180px, rgba(82,111,255,.11), transparent 70%), var(--bg); color: var(--text); font: 14px/1.35 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; background: rgba(7,8,12,.94); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 1500px; margin: 0 auto; }
  .logo { font-weight: 800; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  .status { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 2px var(--green); opacity: .65; } }
  .spacer { flex: 1; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; color: var(--muted); }
  .iconbtn:hover { color: var(--text); border-color: var(--panel3); }
  .iconbtn.on { color: var(--green); border-color: rgba(47,227,172,.4); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 1500px; margin: 10px auto 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
         font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .tab.on { background: var(--panel3); color: var(--text); border-color: var(--panel3); }
  .tab .n { color: var(--faint); font-size: 12px; }
  .tab.on .n { color: var(--muted); }

  main { padding: 14px 16px 60px; max-width: 1500px; margin: 0 auto; }
  .rules { color: var(--faint); font-size: 12px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; grid-column: 1 / -1; }
  .content { display: flex; flex-direction: column; gap: 16px; }
  .grid:empty { display: none; }

  /* new cards and feed rows fade in once (never on the 3-s refresh) */
  .enter { animation: enter .45s ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  /* radar */
  #radar { background: linear-gradient(180deg, rgba(22,25,35,.75), rgba(15,17,23,.75)); border: 1px solid var(--line);
           border-radius: 16px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  #radar[hidden] { display: none; }
  #radar.compact { order: 2; padding: 12px 14px; gap: 14px; }
  .rwrap { position: relative; width: 270px; height: 270px; }
  #radar.compact .rwrap { width: 130px; height: 130px; }
  .rwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--line); stroke-width: .6; }
  .ring.outer { stroke: var(--panel3); stroke-width: .9; }
  .rlab { fill: var(--faint); font-size: 6px; }
  #radar.compact .rlab { display: none; }
  .sweep { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; will-change: transform;
           background: conic-gradient(from 0deg, transparent 0deg 300deg, rgba(82,111,255,.04) 310deg, rgba(82,111,255,.22) 359deg, transparent 360deg);
           animation: sweep 6s linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .blip.rec { fill: var(--green); } .blip.watch { fill: var(--yellow); } .blip.waiting { fill: var(--cyan); }
  .blip.filtered { fill: var(--red); opacity: .45; } .blip.mayhem { fill: var(--purple); opacity: .35; }
  .blip.dead { fill: var(--faint); opacity: .6; }
  .blip.rec { filter: drop-shadow(0 0 3px var(--green)); } .blip.watch { filter: drop-shadow(0 0 3px var(--yellow)); }
  .ping { fill: none; stroke: var(--cyan); stroke-width: .8; animation: ping 1.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(5); } }
  .rinfo { min-width: 0; }
  .rtitle { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  #radar.compact .rtitle { font-size: 14px; }
  .rsub { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
  #radar.compact .rsub { display: none; }
  .rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .rs { background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
  .rs .v { font-weight: 800; font-size: 20px; }
  #radar.compact .rs .v { font-size: 16px; }
  .rs .k { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lg { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .feed { display: flex; flex-direction: column; gap: 4px; }
  #radar.compact .feed { display: none; }
  .frow { display: grid; grid-template-columns: 9px minmax(60px, 1fr) auto auto; gap: 10px; align-items: center; font-size: 12px;
          padding: 6px 8px; border-radius: 8px; background: rgba(22,25,35,.6); cursor: pointer; }
  .frow:hover { background: var(--panel2); }
  .frow .s { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .s small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .frow .w { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
  .frow .t { color: var(--faint); white-space: nowrap; }
  .ftitle { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin: 4px 0 2px; }
  .c-rec { background: var(--green); } .c-watch { background: var(--yellow); } .c-waiting { background: var(--cyan); }
  .c-filtered { background: var(--red); } .c-mayhem { background: var(--purple); } .c-dead { background: var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* latest alert */
  #latest { display: none; position: sticky; top: var(--hh, 96px); z-index: 4; margin: -14px -16px 14px; padding: 8px 16px;
            background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; }
  #latest.show { display: flex; }
  #latest .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  #latest button { flex: none; background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 700; }
  #latest button.done { background: var(--green); color: #07080c; }

  /* card */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex;
          flex-direction: column; gap: 12px; min-width: 0; }
  .card.stage-entry { border-color: rgba(47,227,172,.55); box-shadow: 0 0 0 1px rgba(47,227,172,.25), 0 0 24px rgba(47,227,172,.08); }
  .card.watched { border-color: rgba(245,194,73,.45); }
  .card.filtered { opacity: .6; }
  .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .img { width: 60px; height: 60px; border-radius: 12px; background: var(--panel2); object-fit: cover; flex: none; cursor: pointer;
         border: 1px solid var(--line); }
  .title { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .mini { background: none; border: 0; padding: 2px; color: var(--muted); display: inline-flex; }
  .name .mini:hover { color: var(--text); }
  .sub { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
  .sub b { color: var(--text); font-weight: 600; }
  .acts { display: flex; gap: 6px; flex: none; align-self: flex-start; }
  .acts .iconbtn { padding: 7px; }
  .acts .star.on { color: var(--yellow); border-color: rgba(245,194,73,.45); }
  .acts .star.on svg { fill: var(--yellow); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .5px; text-transform: uppercase;
           color: #07080c; }
  .b-dip { background: var(--dip); } .b-zone { background: var(--zone); } .b-bounce { background: var(--bounce); }
  .b-entry { background: var(--entry); } .b-top, .b-dead { background: var(--panel3); color: var(--muted); }
  .b-mayhem { background: var(--purple); } .b-watch { background: rgba(245,194,73,.15); color: var(--yellow); }
  .why { color: var(--orange); font-size: 12px; }

  .copy { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: var(--blue); color: #fff;
          border: 0; border-radius: 10px; padding: 13px; font-weight: 800; font-size: 16px; }
  .copy code { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .75; }
  .copy.done { background: var(--green); color: #07080c; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi { background: var(--panel2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kpi .k { color: var(--muted); font-size: 11px; }
  .kpi .v { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .red { color: var(--red); } .green { color: var(--green); } .muted { color: var(--muted); }

  .chartbox { position: relative; background: var(--panel2); border-radius: 10px; overflow: hidden; }
  svg.chart { width: 100%; height: 190px; display: block; }
  .clabel { position: absolute; font-size: 11px; color: var(--muted); background: rgba(22,25,35,.85); padding: 1px 6px; border-radius: 6px; }
  .clabel.tl { top: 6px; left: 6px; } .clabel.bl { bottom: 6px; left: 6px; } .clabel.br { bottom: 6px; right: 6px; }
  .clabel.tr { top: 6px; right: 6px; }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m { background: var(--panel2); border: 1px solid transparent; border-radius: 10px; padding: 9px 6px; text-align: center; min-width: 0; }
  .m .v { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 15px; }
  .m .l { color: var(--muted); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m.good .v { color: var(--green); } .m.bad .v { color: var(--red); } .m.bad { border-color: rgba(236,57,122,.3); }
  .m.na .v { color: var(--faint); }

  details { background: var(--panel2); border-radius: 10px; padding: 0 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 9px 0; list-style: none; display: flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { color: var(--text); }
  .dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; color: var(--muted); padding-bottom: 10px; }
  .dl b { color: var(--text); font-weight: 600; text-align: right; }
  .desc { color: var(--muted); font-size: 12px; padding-bottom: 10px; }
  .axbtn { margin: 0 0 10px; }

  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 7px 10px; border-radius: 8px;
             background: var(--panel2); border: 1px solid var(--line); color: var(--muted); text-decoration: none; }
  .links a:hover { color: var(--text); }
  .links a.axiom { background: #fff; color: #07080c; border-color: #fff; font-weight: 800; }

  #log { margin-top: 28px; color: var(--muted); font-size: 12px; }
  #log div { padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; }

  /* overlays */
  #login, #ax { position: fixed; inset: 0; display: none; }
  #login { z-index: 10; background: var(--bg); align-items: center; justify-content: center; padding: 16px; }
  #login.show, #ax.show { display: flex; }
  #login form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  #login input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
                 font-size: 20px; text-align: center; letter-spacing: 3px; }
  #login button { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 14px; font-weight: 700; font-size: 16px; }
  #loginmsg { color: var(--red); min-height: 1.4em; font-size: 13px; }
  #ax { z-index: 8; background: rgba(0,0,0,.65); align-items: flex-end; justify-content: center; }
  #ax form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 16px; width: 100%;
             max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
  .axgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .axgrid label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  .axgrid input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 16px; }
  .axrow { display: flex; gap: 8px; }
  .axrow button { flex: 1; padding: 12px; font-weight: 700; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); }
  .axrow button[type=submit] { background: var(--blue); color: #fff; border: 0; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 9; background: var(--green); color: #07080c;
           font-weight: 700; padding: 10px 16px; border-radius: 10px; display: none; white-space: nowrap; }
  #toast.show { display: block; }

  @media (max-width: 720px) {
    #radar { grid-template-columns: 1fr; justify-items: center; }
    #radar .rinfo { width: 100%; }
    .rwrap { width: 230px; height: 230px; }
    #radar.compact { grid-template-columns: auto 1fr; justify-items: stretch; }
    #radar.compact .rwrap { width: 96px; height: 96px; }
    .rstats { grid-template-columns: repeat(2, 1fr); }
    #radar.compact .rstats { grid-template-columns: repeat(2, 1fr); margin-bottom: 0; }
  }
  @media (max-width: 480px) {
    .iconbtn span { display: none; }
    header { padding: 8px 12px; } main { padding: 12px 12px 60px; } #latest { margin: -12px -12px 12px; padding: 8px 12px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .status .long { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">🇸🇪 Sweden</div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="testpush" title="Send a test push to your phone (ntfy)"></button>
    <button class="iconbtn" id="sound" title="Sound and notifications"></button>
    <button class="iconbtn" id="lock" title="Lock"></button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="toast"></div>
<div id="ax"><form id="axform" autocomplete="off">
  <b id="axtitle"></b>
  <div class="axgrid">
    <label>Top 10 %<input name="top10" inputmode="decimal"></label><label>Dev %<input name="dev" inputmode="decimal"></label>
    <label>Snipers %<input name="snipers" inputmode="decimal"></label><label>Insiders %<input name="insiders" inputmode="decimal"></label>
    <label>Bundlers %<input name="bundlers" inputmode="decimal"></label><label>Holders<input name="holders" inputmode="numeric"></label>
  </div>
  <div class="axrow"><button type="button" id="axcancel">Cancel</button><button type="submit">Save</button></div>
</form></div>
<div id="login"><form id="loginform" autocomplete="off">
  <div class="logo" style="font-size:20px">🇸🇪 Sweden terminal</div>
  <input id="pk" type="password" autocomplete="current-password" placeholder="Passkey" aria-label="Passkey">
  <button type="submit">Unlock</button>
  <div id="loginmsg"></div>
</form></div>
<main>
  <div id="latest"><div class="t" id="latesttext"></div><button id="latestcopy">Copy CA</button></div>
  <p class="rules" id="rules"></p>
  <div class="content">
    <section id="radar" class="hero" hidden></section>
    <div class="grid" id="grid"></div>
  </div>
  <div id="log"></div>
</main>
<script>
// ---------- icons (inline, no external files) ----------
const P = {
  top10: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',
  dev: '<path d="M6 13.9V20h12v-6.1M6 17h12M6 14a4 4 0 0 1-.6-7.9A5 5 0 0 1 12 3a5 5 0 0 1 6.6 3.1A4 4 0 0 1 18 14"/>',
  snipers: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  bundle: '<path d="M12 3l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 17l8 4 8-4"/>',
  holders: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a4 4 0 0 0-3-3.9"/>',
  launches: '<path d="M5 19c1-3 3-4 5-4M14 10l-4 4M9.5 14.5L5 13l3-4h5M9.5 14.5L11 19l4-3v-5M13 9c2-4 5-6 8-6 0 3-2 6-6 8"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5z"/>',
  hide: '<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  show: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  belloff: '<path d="M3 3l18 18M8.7 3.7A6 6 0 0 1 18 8c0 3 .5 5 1.2 6.4M17 17H3s3-2 3-9c0-.5 0-1 .2-1.5M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const ORDER = { entry: 0, bounce: 1, zone: 2, dip: 3, top: 4, dead: 5 };
const LABEL = { entry: "Entry", bounce: "Bounce", zone: "In zone", dip: "Dip", top: "Near top", dead: "Dead" };
const TABS = [["all", "Recommended"], ["watch", "★ Watchlist"], ["entry", "Entry"], ["bounce", "Bounce"], ["zone", "Zone"],
              ["dip", "Dip"], ["filtered", "Filtered out"], ["hidden", "Hidden by me"]];
const NEEDS_ALL = ["filtered", "hidden"];             // tabs that need the coins the filter hides
let tab = "all", soundOn = false, audio = null, lastAlert = null, state = null, token = null;
const openDetails = new Set(), cardsSeen = new Set();
let cardsReady = false;
try { token = localStorage.getItem("swedenToken"); tab = localStorage.getItem("swedenTab") || "all"; } catch (e) {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(x * 100 >= 10 ? 0 : d) + "%";
const usd = (x) => !x ? "–" : x >= 1e6 ? "$" + (x / 1e6).toFixed(2) + "M" : x >= 1e3 ? "$" + (x / 1e3).toFixed(1) + "K" : "$" + x.toFixed(0);
const dur = (m) => m < 1 ? "<1m" : m < 60 ? Math.round(m) + "m" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m";
const secs = (s) => s == null ? "–" : s < 60 ? Math.round(s) + "s" : dur(s / 60);
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : (u && /^ipfs:\/\//i.test(u) ? "https://ipfs.io/ipfs/" + u.slice(7) : "");
const xUrl = (t) => !t ? "" : /^https?:/i.test(t) ? t : "https://x.com/" + t.replace(/^@/, "");
const short = (m) => m.slice(0, 4) + "…" + m.slice(-4);

// ---------- chart ----------
function chart(c) {
  // p: [seconds since graduation, close, high, low] (mcap in SOL); log scale so a -80 % drop doesn't flatten the rest
  const p = c.pts; if (!p || p.length < 2) return '<div class="chartbox"><svg class="chart"></svg></div>';
  const W = 400, H = 190, L = Math.log, sol = state.sol_usd || 0;
  const x1 = p[p.length - 1][0] || 1;
  const ys = p.flatMap((q) => [q[2], q[3]]).concat([c.peak, c.low ?? c.peak]).filter((v) => v > 0);
  const y0 = L(Math.min(...ys)), y1 = L(Math.max(...ys));
  const X = (x) => (x / x1) * (W - 10) + 5, Y = (y) => H - 22 - ((L(y) - y0) / ((y1 - y0) || 1)) * (H - 44);
  const pt = (q, k) => X(q[0]).toFixed(1) + " " + Y(q[k]).toFixed(1);
  const line = p.map((q, i) => (i ? "L" : "M") + pt(q, 1)).join(" ");
  const band = p.map((q, i) => (i ? "L" : "M") + pt(q, 2)).join(" ") + " " + p.slice().reverse().map((q) => "L" + pt(q, 3)).join(" ") + " Z";
  const area = line + ` L${X(x1).toFixed(1)} ${H} L${X(p[0][0]).toFixed(1)} ${H} Z`;
  const col = getComputedStyle(document.documentElement).getPropertyValue("--" + c.stage).trim() || "#7d8396";
  const id = "g" + c.mint.slice(0, 8);
  const hl = (y, color) => `<line x1="0" x2="${W}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="${color}" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".7"/>`;
  const last = p[p.length - 1];
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${hl(c.peak, "#7d8396")}${c.low ? hl(c.low, "#ff8a3d") : ""}
    <path d="${area}" fill="url(#${id})"/>
    <path d="${band}" fill="${col}" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${col}"/>
  </svg>
  <span class="clabel tl">top ${usd(c.peak * sol)}</span>${c.low ? `<span class="clabel bl">low ${usd(c.low * sol)}</span>` : ""}
  <span class="clabel br">${dur(c.grad_min)} since graduation</span></div>`;
}

// ---------- card ----------
function metric(icon, label, val, max, fmt = pct) {
  const cls = val == null ? "na" : max == null ? "" : val <= max ? "good" : "bad";
  return `<div class="m ${cls}" title="${esc(label)}${max != null ? " (limit " + fmt(max) + ")" : ""}"><div class="v num">${ic(icon)}${val == null ? "–" : fmt(val)}</div><div class="l">${label}</div></div>`;
}

function card(c) {
  const m = c.meta || {}, img = safeUrl(m.image), ch = c.checks || {}, l = c.live || {}, s = state.settings;
  const axiom = "https://axiom.trade/meme/" + (c.pool || c.mint) + "?chain=sol";
  const links = [["pump.fun", "https://pump.fun/coin/" + c.mint], ["DexScreener", "https://dexscreener.com/solana/" + c.mint],
    ["Bubblemaps", "https://app.bubblemaps.io/sol/token/" + c.mint], ["X search", "https://x.com/search?f=live&q=" + c.mint],
    ["Solscan", "https://solscan.io/token/" + c.mint]];
  if (m.twitter) links.push(["Twitter", xUrl(m.twitter)]);

  const open = openDetails.has(c.mint) ? " open" : "";
  const fresh = cardsReady && !cardsSeen.has(c.mint); cardsSeen.add(c.mint);
  return `<div class="card stage-${c.stage}${c.watched ? " watched" : ""}${c.visible ? "" : " filtered"}${fresh ? " enter" : ""}" data-mint="${esc(c.mint)}">
  <div class="head">
    ${img ? `<img class="img" data-copy="${esc(c.mint)}" src="${esc(img)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : `<div class="img" data-copy="${esc(c.mint)}"></div>`}
    <div class="title">
      <div class="name"><span>${esc(c.name)}</span><button class="mini" data-copy="${esc(c.mint)}" title="Copy CA">${ic("copy")}</button></div>
      <div class="sub"><span>$${esc(c.sym)}</span><span>age <b>${dur(c.age_min)}</b></span></div>
    </div>
    <div class="acts">
      <button class="iconbtn star${c.watched ? " on" : ""}" data-pref="${c.watched ? "unwatch" : "watch"}" title="${c.watched ? "Remove from" : "Add to"} watchlist">${ic("star")}</button>
      <button class="iconbtn" data-pref="${c.user_hidden ? "unhide" : "hide"}" title="${c.user_hidden ? "Show again" : "Hide from recommendations and alerts"}">${ic(c.user_hidden ? "show" : "hide")}</button>
    </div>
  </div>
  <div class="badges">${badges}</div>
  <button class="copy" data-copy="${esc(c.mint)}" data-big="1"><span>Copy CA</span><code>${esc(short(c.mint))}</code></button>
  <div class="kpis num">
    <div class="kpi"><div class="k">Mcap</div><div class="v">${usd(c.mcap_usd)}</div></div>
    <div class="kpi"><div class="k">From top</div><div class="v red">−${pct(c.dd, 0)}</div></div>
    <div class="kpi"><div class="k">From low</div><div class="v ${c.from_low ? "green" : "muted"}">${c.from_low == null ? "–" : "+" + pct(c.from_low, 0)}</div></div>
    <div class="kpi"><div class="k">Last trade</div><div class="v ${lastCls}">${secs(c.last_trade_s)}</div></div>
  </div>
  ${chart(c)}
  <div class="metrics">
    ${metric("top10", "Top 10 H.", l.top10, s.top10_max)}
    ${metric("dev", "Dev H.", l.dev, s.dev_max)}
    ${metric("snipers", "Snipers H.", l.snipers_1_3, s.sniper_max)}
    ${metric("bundle", "Bundlers", l.bundle_launch, s.bundle_max)}
    ${metric("holders", "Holders", l.holders, null, (v) => String(v))}

  <details data-d="${esc(c.mint)}"${open}><summary>${ic("info")} Details</summary>
    <div class="dl num">
      <span>Bundle at graduation (filter)</span><b>${pct(ch.bundle)}</b>
      <span>Bundle: slot with 2+ / 4+ buyers</span><b>${pct(l.bundle_2)} / ${pct(l.bundle_4)}</b>
      <span>Snipers: first 10 slots</span><b>${pct(l.snipers_0_10)}</b>
      <span>Top 3 wallets' share of trades</span><b>${pct(ch.top3_trades)}</b>
      <span>Buys with identical size</span><b>${pct(ch.same_sizes)}</b>
      <span>Traders on the curve</span><b>${ch.traders ?? "–"}</b>
      <span>Dev sold</span><b>${ch.dev_sold ? "yes" : "no"}</b>
      <span>Graduated</span><b>${dur(c.grad_min)} ago</b>
    </div>
    ${m.description ? `<div class="desc">${esc(m.description)}</div>` : ""}
    <button class="iconbtn axbtn" data-ax="${esc(c.mint)}" data-sym="${esc(c.sym)}">Enter Axiom's numbers ✎</button>
  </details>
  <div class="links"><a class="axiom" href="${esc(axiom)}" target="_blank" rel="noopener noreferrer">Axiom ${ic("ext")}</a>${links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`).join("")}</div>
</div>`;
}

// ---------- radar (built once, then updated in place so nothing restarts on refresh) ----------
const R_MAX = 100, R_MIN = 10, HOURS = 6;
const STATUS = { rec: "Recommended", watch: "Watchlist", waiting: "Passes checks, waiting for the dip", filtered: "Filtered out",
                 mayhem: "Mayhem", dead: "Dead (crashed)" };
const blips = new Map(), feedSeen = new Set();
let radarBuilt = false, radarFirst = true;
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }
function buildRadar() {
  const rings = [1, 2, 3, 4, 5, 6].map((h) => { const r = R_MIN + (h / HOURS) * (R_MAX - R_MIN);
    return `<circle class="ring${h === HOURS ? " outer" : ""}" r="${r}"/><text class="rlab" x="2" y="${-r + 7}">${h}h</text>`; }).join("");
  $("#radar").innerHTML = `<div class="rwrap"><svg viewBox="-104 -104 208 208" aria-hidden="true">
      <line class="ring" x1="-${R_MAX}" x2="${R_MAX}" y1="0" y2="0"/><line class="ring" y1="-${R_MAX}" y2="${R_MAX}" x1="0" x2="0"/>
      ${rings}<circle r="2" fill="var(--blue)"/><g id="blips"></g><g id="pings"></g></svg><div class="sweep"></div></div>
    <div class="rinfo"><div class="rtitle"><span class="dot live"></span><span id="rtitle">Scanning graduates</span></div>
      <div class="rsub">Every pump.fun graduate of the last ${HOURS} h. Centre = just graduated, each ring one more hour. Tap a row to copy its CA.</div>
      <div class="rstats num" id="rstats"></div><div class="feed" id="feed"></div></div>`;
  radarBuilt = true;
}
function updateRadar() {
  const el = $("#radar"), rec = state.coins.filter((c) => c.visible && !c.user_hidden).length;
  const hero = tab === "all" && rec === 0;
  el.hidden = !(tab === "all" || tab === "watch");
  if (el.hidden) return;
  if (!radarBuilt) buildRadar();
  el.className = hero ? "hero" : "compact";
  const rs = (state.radar || []).filter((r) => r.status !== "hidden");
  const n = (st) => rs.filter((r) => r.status === st).length;
  $("#rtitle").textContent = hero ? "Scanning graduates" : "Radar";
  $("#rstats").innerHTML = [["waiting", "Waiting for dip", n("waiting")], ["filtered", "Filtered out", n("filtered")],
    ["mayhem", "Mayhem", n("mayhem")], ["dead", "Dead", n("dead")]]
    .map(([st, k, v]) => `<div class="rs"><div class="v">${v}</div><div class="k"><span class="lg c-${st}"></span>${k}</div></div>`).join("");
  // blips: create new ones (with a single ping), move existing ones, drop gone ones
  const g = $("#blips"), live = new Set();
  for (const r of rs) {
    live.add(r.mint);
    const rad = R_MIN + Math.min(r.grad_min / 60, HOURS) / HOURS * (R_MAX - R_MIN), a = hash(r.mint) * 2 * Math.PI;
    const x = (Math.cos(a) * rad).toFixed(1), y = (Math.sin(a) * rad).toFixed(1);
    let b = blips.get(r.mint);
    if (!b) {
      b = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      b.setAttribute("r", r.status === "rec" || r.status === "watch" ? 3.4 : 2.4);
      g.appendChild(b); blips.set(r.mint, b);
      if (!radarFirst) {
        const pg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        pg.setAttribute("class", "ping"); pg.setAttribute("cx", x); pg.setAttribute("cy", y); pg.setAttribute("r", 2.4);
        $("#pings").appendChild(pg); setTimeout(() => pg.remove(), 1500);
      }
    }
    b.setAttribute("class", "blip " + r.status); b.setAttribute("cx", x); b.setAttribute("cy", y);
    b.innerHTML = `<title>${esc(r.sym)} · ${esc(STATUS[r.status] || r.status)}</title>`;
  }
  for (const [m, b] of blips) if (!live.has(m)) { b.remove(); blips.delete(m); }
  // feed of the latest graduations
  const recent = rs.slice(0, 8);
  $("#feed").innerHTML = recent.length ? '<div class="ftitle">Latest graduations</div>' + recent.map((r) => {
    const fresh = !radarFirst && !feedSeen.has(r.mint);
    const why = r.status === "waiting" ? "passes checks · waiting for the dip" : r.status === "rec" || r.status === "watch" ? STATUS[r.status] : r.why;
    return `<div class="frow${fresh ? " enter" : ""}" data-copy="${esc(r.mint)}"><span class="lg c-${r.status}"></span>
      <span class="s">$${esc(r.sym)}<small>${usd(r.mcap_usd)}</small></span><span class="w">${esc(why)}</span><span class="t">${dur(r.grad_min)}</span></div>`;
  }).join("") : '<div class="ftitle">No graduations in the last hours</div>';
  recent.forEach((r) => feedSeen.add(r.mint));
  radarFirst = false;
}

// ---------- page ----------
function inTab(c) {
  if (tab === "hidden") return c.user_hidden;
  if (c.user_hidden) return false;
  if (tab === "filtered") return !c.visible;
  if (!c.visible) return false;
  if (tab === "watch") return c.watched;
  return tab === "all" || c.stage === tab;
}

function renderTabs() {
  const cs = state ? state.coins : [];
  const count = (t) => { const keep = tab; tab = t; const n = cs.filter(inTab).length; tab = keep; return n; };
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button class="tab${k === tab ? " on" : ""}" data-tab="${k}">${t}<span class="n">${!state ? "" : NEEDS_ALL.includes(k) ? (state.counts || {})[k] ?? "" : count(k)}</span></button>`).join("");
}

function render() {
  renderTabs();
  if (!state) return;
  const s = state.settings;
  $("#rules").textContent = `Recommended: graduated pump.fun coins ≤ ${s.max_age_h} h old, passing the on-chain checks (bundle ≤ ${pct(s.bundle_max, 0)}), ` +
    `mcap ≤ ${usd(s.max_mcap_usd)}, at least ${pct(s.show_dd, 0)} below their top. Watchlist coins always show. SOL $${state.sol_usd.toFixed(0)}.`;
  const cs = state.coins.filter(inTab);
  cs.sort((a, b) => (b.watched - a.watched) || (b.visible - a.visible) || (ORDER[a.stage] - ORDER[b.stage]) || (a.age_min - b.age_min));
  const empty = { all: "Nothing recommended right now. Waiting for graduates that dip…", watch: "Your watchlist is empty. Tap ☆ on a coin to add it.",
                  hidden: "You haven't hidden any coin.", filtered: "No coins filtered out right now." }[tab] || "No coin in this stage right now.";
  $("#grid").innerHTML = NEEDS_ALL.includes(tab) && !state.all ? '<div class="empty">Loading…</div>' :
    cs.length ? cs.map(card).join("") : tab === "all" ? "" : `<div class="empty">${empty}</div>`;
  cardsReady = true;
  updateRadar();
  $("#log").innerHTML = state.alerts.length ? "<b>Alerts</b> · tap one to copy its CA" + state.alerts.slice(-15).reverse().map((a) =>
    `<div data-copy="${esc(a.mint)}">${new Date(a.ts * 1000).toLocaleTimeString()} · ${a.kind === "entry" ? "🟢" : "🔔"} ${esc(a.text)}</div>`).join("") : "";
  const last = state.alerts[state.alerts.length - 1];
  $("#latest").classList.toggle("show", !!last);
  if (last) {
    $("#latesttext").textContent = `${new Date(last.ts * 1000).toLocaleTimeString()} · ${last.kind === "entry" ? "🟢" : "🔔"} ${last.text}`;
    $("#latestcopy").dataset.copy = last.mint;
  }
}

function beep(kind) {
  if (!soundOn || !audio) return;
  const notes = kind === "entry" ? [660, 880, 1100] : [520, 660];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.18;
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.start(t); o.stop(t + 0.17);
  });
}

function handleAlerts() {
  const as = state.alerts;
  const maxId = as.length ? as[as.length - 1].id : 0;
  if (lastAlert === null) { lastAlert = maxId; return; }
  const fresh = as.filter((a) => a.id > lastAlert);
  lastAlert = Math.max(lastAlert, maxId);
  if (!fresh.length) return;
  beep(fresh.some((a) => a.kind === "entry") ? "entry" : "new");
  if ("Notification" in window && Notification.permission === "granted")
    fresh.forEach((a) => new Notification(a.kind === "entry" ? "Entry signal" : "New coin to check", { body: a.text }));
  document.title = "(" + fresh.length + ") Sweden terminal";
  setTimeout(() => (document.title = "Sweden terminal"), 8000);
}

function showLogin(msg) { $("#login").classList.add("show"); $("#loginmsg").textContent = msg || ""; $("#pk").focus(); }
function dropToken() { token = null; try { localStorage.removeItem("swedenToken"); } catch (e) {} }

async function tick() {
  if (!token) return showLogin();
  const all = NEEDS_ALL.includes(tab);
  try {
    const r = await fetch("/api/state" + (all ? "?all=1" : ""), { cache: "no-store", headers: { "X-Sweden-Token": token } });
    if (r.status === 401) { dropToken(); return showLogin("Please enter the passkey"); }
    state = await r.json();
    $("#dot").className = "dot" + (state.live ? " live" : "");
    const n = state.coins.filter((c) => c.visible && !c.user_hidden).length;
    $("#status").innerHTML = (state.live ? "live" : "loading history…") + ` · ${n} shown<span class="long"> · ${new Date().toLocaleTimeString()}</span>`;
    handleAlerts(); render();
  } catch (e) { $("#dot").className = "dot"; $("#status").textContent = "no connection to the terminal"; }
}

// ---------- actions ----------
function toast(text, ok = true) {
  const ts = $("#toast"); ts.textContent = text; ts.style.background = ok ? "var(--green)" : "var(--red)";
  ts.classList.add("show"); clearTimeout(ts._t); ts._t = setTimeout(() => ts.classList.remove("show"), 1600);
}
function copyCA(t, btn) {
  const done = () => {
    toast("CA copied: " + short(t));
    if (btn) { const old = btn.innerHTML; btn.classList.add("done"); btn.innerHTML = btn.id === "latestcopy" ? "Copied ✓" : "<span>Copied ✓</span>";
      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = old; }, 1400); }
  };
  const fallback = () => {                                   // plain http / older browsers
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand("copy"); done(); } catch (e) { prompt("Copy the CA:", t); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
async function setPref(mint, action) {
  try {
    const r = await fetch("/api/prefs", { method: "POST", headers: { "Content-Type": "application/json", "X-Sweden-Token": token },
                                          body: JSON.stringify({ mint, action }) });
    if (!r.ok) throw 0;
    toast({ watch: "Added to watchlist", unwatch: "Removed from watchlist", hide: "Hidden - no more alerts for it", unhide: "Shown again" }[action]);
    tick();
  } catch (e) { toast("Not saved", false); }
}

let axMint = null;
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; try { localStorage.setItem("swedenTab", tab); } catch (e) {} render(); tick(); return; }
  const pf = e.target.closest("[data-pref]");
  if (pf) { setPref(pf.closest("[data-mint]").dataset.mint, pf.dataset.pref); return; }
  const ax = e.target.closest("[data-ax]");
  if (ax) { axMint = ax.dataset.ax; $("#axform").reset(); $("#axtitle").textContent = "What Axiom shows for $" + ax.dataset.sym + " right now";
            $("#ax").classList.add("show"); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp && cp.dataset.copy) copyCA(cp.dataset.copy, cp.dataset.big || cp.id === "latestcopy" ? cp : cp.closest(".card")?.querySelector("[data-big]"));
});
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.d) return;
  d.open ? openDetails.add(d.dataset.d) : openDetails.delete(d.dataset.d);
}, true);

$("#loginform").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passkey: $("#pk").value }) });
    const j = await r.json();
    if (r.ok && j.token) {
      token = j.token; try { localStorage.setItem("swedenToken", token); } catch (e) {}
      $("#pk").value = ""; $("#login").classList.remove("show"); tick();
    } else showLogin(j.error === "locked" ? `Too many wrong tries - wait ${j.wait} s` : "Wrong passkey" + (j.wait ? ` - locked for ${j.wait} s` : ""));
  } catch (e) { showLogin("No connection to the terminal"); }
};
$("#lock").innerHTML = ic("lock");
$("#lock").onclick = () => { dropToken(); state = null; $("#grid").innerHTML = ""; $("#radar").hidden = true; $("#log").innerHTML = ""; $("#latest").classList.remove("show"); renderTabs(); showLogin(); };
const soundLabel = () => { $("#sound").innerHTML = ic(soundOn ? "bell" : "belloff") + `<span>${soundOn ? "Sound on" : "Sound off"}</span>`; $("#sound").classList.toggle("on", soundOn); };
$("#sound").onclick = () => {
  soundOn = !soundOn;
  if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  soundLabel(); if (soundOn) beep("new");
};
$("#testpush").innerHTML = ic("phone") + "<span>Test push</span>";
$("#testpush").onclick = async () => {
  try {
    const r = await fetch("/api/testpush", { method: "POST", headers: { "X-Sweden-Token": token } });
    const j = await r.json(); toast(j.msg || "failed", !!j.ok);
  } catch (e) { toast("No connection", false); }
};
$("#axcancel").onclick = () => $("#ax").classList.remove("show");
$("#axform").onsubmit = async (e) => {
  e.preventDefault();
  const values = {}; new FormData(e.target).forEach((v, k) => { v = String(v).replace(",", ".").replace("%", "").trim(); if (v) values[k] = v; });
  try {
    const r = await fetch("/api/axiom", { method: "POST", headers: { "Content-Type": "application/json", "X-Sweden-Token": token },
                                          body: JSON.stringify({ mint: axMint, values }) });
    toast(r.ok ? "Saved - thanks" : "Not saved (empty or coin gone)", r.ok);
  } catch (err) { toast("No connection", false); }
  $("#ax").classList.remove("show");
};
const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
soundLabel(); renderTabs(); setHH(); addEventListener("resize", setHH);
tick(); setInterval(tick, 3000);
</script>
