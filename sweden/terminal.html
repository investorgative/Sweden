<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Sweden terminal</title>
<style>
  :root {
    /* four base colours per user (Settings > Style); the rest is mixed from them */
    --bg: #07080c; --panel: #0f1117; --text: #e9ecf5; --blue: #526fff;
    --panel2: color-mix(in srgb, var(--panel), var(--text) 5%); --panel3: color-mix(in srgb, var(--panel), var(--text) 9%);
    --line: color-mix(in srgb, var(--panel), var(--text) 11%);
    --muted: color-mix(in srgb, var(--text) 55%, var(--bg)); --faint: color-mix(in srgb, var(--text) 32%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--blue) 50%, transparent);
    --green: #2fe3ac; --red: #ec397a; --yellow: #f5c249;
    --orange: #ff8a3d; --cyan: #3fc8ff; --purple: #a78bfa;
    --dip: var(--yellow); --zone: var(--orange); --bounce: var(--cyan); --entry: var(--green); --top: var(--muted); --dead: var(--faint);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { overflow-x: hidden; }
  .bar { min-width: 0; }
  body { margin: 0; min-height: 100vh;
         background: radial-gradient(1100px 420px at 50% -180px, color-mix(in srgb, var(--blue) 11%, transparent), transparent 70%), var(--bg); color: var(--text); font: 14px/1.35 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 1500px; margin: 0 auto; }
  .logo { font-weight: 800; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
  .status { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 2px var(--green); opacity: .65; } }
  .spacer { flex: 1; }
  a.iconbtn { text-decoration: none; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; color: var(--muted); }
  .iconbtn:hover { color: var(--text); border-color: var(--panel3); }
  .iconbtn.on { color: var(--green); border-color: rgba(47,227,172,.4); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 1500px; margin: 10px auto 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
         font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .tab.on { background: var(--panel3); color: var(--text); border-color: var(--panel3); }
  .tab .n { color: var(--faint); font-size: 12px; }
  .tab.on .n { color: var(--muted); }

  main { padding: 14px 16px 60px; max-width: 1500px; margin: 0 auto; }
  .rules { color: var(--faint); font-size: 12px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; grid-column: 1 / -1; }
  .content { display: flex; flex-direction: column; gap: 16px; }
  .grid:empty { display: none; }

  /* new cards and feed rows fade in once (never on the 3-s refresh) */
  .enter { animation: enter .45s ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  /* radar */
  #radar { background: linear-gradient(180deg, color-mix(in srgb, var(--panel2) 75%, transparent), color-mix(in srgb, var(--panel) 75%, transparent)); border: 1px solid var(--line);
           border-radius: 16px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  #radar[hidden] { display: none; }
  #radar.compact { order: 2; padding: 12px 14px; gap: 14px; }
  .rwrap { position: relative; width: 270px; height: 270px; }
  #radar.compact .rwrap { width: 130px; height: 130px; }
  .rwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--line); stroke-width: .6; }
  .ring.outer { stroke: var(--panel3); stroke-width: .9; }
  .rlab { fill: var(--faint); font-size: 6px; }
  #radar.compact .rlab { display: none; }
  .sweep { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; will-change: transform;
           background: conic-gradient(from 0deg, transparent 0deg 300deg, color-mix(in srgb, var(--blue) 4%, transparent) 310deg, color-mix(in srgb, var(--blue) 22%, transparent) 359deg, transparent 360deg);
           animation: sweep 6s linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .blip.rec { fill: var(--green); } .blip.watch { fill: var(--yellow); } .blip.waiting { fill: var(--cyan); }
  .blip.filtered { fill: var(--red); opacity: .45; } .blip.mayhem { fill: var(--purple); opacity: .35; }
  .blip.dead { fill: var(--faint); opacity: .6; }
  .blip.rec { filter: drop-shadow(0 0 3px var(--green)); } .blip.watch { filter: drop-shadow(0 0 3px var(--yellow)); }
  .ping { fill: none; stroke: var(--cyan); stroke-width: .8; animation: ping 1.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(5); } }
  .rinfo { min-width: 0; }
  .rtitle { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  #radar.compact .rtitle { font-size: 14px; }
  .rsub { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
  #radar.compact .rsub { display: none; }
  .rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .rs { background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
  .rs .v { font-weight: 800; font-size: 20px; }
  #radar.compact .rs .v { font-size: 16px; }
  .rs .k { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lg { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .feed { display: flex; flex-direction: column; gap: 4px; }
  #radar.compact .feed { display: none; }
  .frow { display: grid; grid-template-columns: 9px minmax(60px, 1fr) auto auto; gap: 10px; align-items: center; font-size: 12px;
          padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--panel2) 60%, transparent); cursor: pointer; }
  .frow:hover { background: var(--panel2); }
  .frow .s { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .s small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .frow .w { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
  .frow .t { color: var(--faint); white-space: nowrap; }
  .ftitle { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin: 4px 0 2px; }
  .c-rec { background: var(--green); } .c-watch { background: var(--yellow); } .c-waiting { background: var(--cyan); }
  .c-filtered { background: var(--red); } .c-mayhem { background: var(--purple); } .c-dead { background: var(--faint); }

  /* red alarm flash over everything (clicks pass through) */
  #flash { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
           background: radial-gradient(ellipse at center, rgba(236,57,122,.06) 30%, rgba(236,57,122,.42) 100%);
           box-shadow: inset 0 0 120px 30px rgba(236,57,122,.55); }
  #flash.on { animation: alarm 2.8s ease-out; }
  #flash.static { opacity: .75; }
  @keyframes alarm { 0% { opacity: 0; } 6% { opacity: 1; } 24% { opacity: .15; } 36% { opacity: 1; } 56% { opacity: .15; }
                     68% { opacity: .9; } 100% { opacity: 0; } }

  /* pasted CA: status bar and highlighted card */
  #jump { display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent-soft);
          border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 13px; }
  #jump.show { display: flex; }
  #jump .jt { flex: 1; min-width: 0; }
  #jump .jt b { font-size: 14px; }
  #jump .jt div { color: var(--muted); margin-top: 2px; }
  #jump a, #jump button { flex: none; font-size: 12px; padding: 6px 9px; border-radius: 8px; background: var(--panel2);
                          border: 1px solid var(--line); color: var(--muted); text-decoration: none; }
  .card.focus { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* search */
  #search { display: none; position: relative; margin: 0 0 12px; }
  #search.show { display: block; }
  #search input { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                  padding: 11px 38px 11px 38px; font-size: 15px; }
  #search input:focus { outline: none; border-color: var(--blue); }
  #search .si { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  #search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted);
                   padding: 6px 8px; font-size: 16px; display: none; }
  #search.has .clear { display: block; }
  #search .cnt { color: var(--faint); font-size: 12px; margin-top: 6px; }

  /* original of a copied coin */
  .orig { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .orig .ot { color: var(--muted); }
  .orow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; background: var(--panel3); border-radius: 8px; padding: 8px 10px; }
  .orow .on { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orow .on small { color: var(--muted); font-weight: 400; }
  .orow .ov { color: var(--muted); grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .orow .ov b { color: var(--text); font-weight: 600; }
  .orow .ol { display: flex; gap: 6px; }
  .orow .ol a, .orow .ol button { font-size: 11px; padding: 3px 7px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line);
                                   color: var(--muted); text-decoration: none; }
  .orow.top { outline: 1px solid var(--accent-soft); }
  svg.ochart { width: 100%; height: 110px; display: block; background: var(--panel3); border-radius: 8px; }

  /* account screen (after the passkey) */
  #account { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; align-items: center; justify-content: center;
             padding: 16px; overflow-y: auto; }
  #account.show { display: flex; }
  #account form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  #account .atabs { display: flex; gap: 6px; } #account .atabs button { flex: 1; }
  #account input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 13px; font-size: 16px; }
  #account input:focus { outline: none; border-color: var(--blue); }
  #account .primary { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 13px; font-weight: 700; font-size: 16px; }
  #account .link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px; }
  #account .hint { color: var(--muted); font-size: 13px; text-align: center; }
  #accmsg { color: var(--red); min-height: 1.3em; font-size: 13px; text-align: center; }
  #accmsg.ok { color: var(--green); }

  /* settings drawer */
  #settings { position: fixed; inset: 0; z-index: 9; display: none; }
  #settings.show { display: block; }
  #settings .shade { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  #settings .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel);
                      border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #settings .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #settings .dhead b { flex: 1; font-size: 16px; }
  #settings .dbody { flex: 1; overflow-y: auto; padding: 6px 16px 20px; }
  #settings .dfoot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #settings .dfoot button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; border: 1px solid var(--line); background: var(--panel2); }
  #settings .dfoot .save { background: var(--blue); color: #fff; border: 0; }
  .sec { padding: 14px 0 6px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
  .row label { flex: 1; } .row small { display: block; color: var(--faint); font-size: 11px; }
  .row input[type=number], .row input[type=text], .row select { width: 120px; background: var(--panel2); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 14px; }
  .row input[type=text] { width: 170px; }
  .row .unit { color: var(--muted); font-size: 12px; width: 22px; }
  .row input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--blue); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .presets button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--panel2); font-size: 12px; }
  .presets i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .modes button { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); text-align: left; font-size: 13px; }
  .modes button small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .modes button.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }

  /* other empty-screen designs: live feed and heat grid */
  #radar.mode-pulse, #radar.mode-grid { grid-template-columns: 1fr; }
  .pfeed { display: flex; flex-direction: column; gap: 6px; }
  .prow { display: grid; grid-template-columns: 4px minmax(70px, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0;
          border-radius: 10px; background: var(--panel2); cursor: pointer; overflow: hidden; }
  .prow .bar { align-self: stretch; } .prow .s { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .s small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .m { font-weight: 700; } .prow .t { color: var(--faint); font-size: 12px; }
  .hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .tile { border-radius: 10px; padding: 9px 10px; cursor: pointer; min-width: 0; border: 1px solid transparent;
          background: color-mix(in srgb, var(--tc) 14%, var(--panel2)); border-color: color-mix(in srgb, var(--tc) 35%, transparent); }
  .tile b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  /* coin page (tap a card's chart) */
  #coinpage { position: fixed; inset: 0; z-index: 6; background: var(--bg); overflow-y: auto; display: none; }
  #coinpage.show { display: block; }
  .cp-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
            background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .cp-top .img { width: 40px; height: 40px; }
  .cp-top .title { flex: 1; min-width: 0; }
  .cp-top .name { font-size: 16px; }
  .cp-top .acts { align-self: center; }
  .cp-top a.axiom { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #07080c; border-radius: 8px; padding: 7px 10px;
                    font-weight: 800; font-size: 13px; text-decoration: none; }
  .cp-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--sw, 340px); gap: 14px; padding: 14px 16px 60px; max-width: 1500px; margin: 0 auto; }
  .cp-main, .cp-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cp-pnl { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cp-body.editing .cp-main, .cp-body.editing .cp-side { min-height: 120px; border-radius: 14px; outline: 1px dashed var(--panel3); outline-offset: 4px; }
  .cp-body.editing [data-panel] { position: relative; }
  .cp-body.editing [data-panel][hidden] { display: flex !important; min-height: 64px; opacity: .55; }
  .pnl-edit { display: none; }
  .cp-body.editing .pnl-edit { display: flex; position: absolute; inset: 0; z-index: 2; align-items: center; justify-content: center; gap: 8px;
    background: color-mix(in srgb, var(--bg) 86%, transparent); border: 2px dashed var(--blue); border-radius: 12px; cursor: grab; }
  .pnl-edit b { position: absolute; top: 8px; left: 12px; font-size: 12px; color: var(--text); background: var(--panel); padding: 3px 8px; border-radius: 6px; }
  .pnl-edit button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 11px; font-size: 14px; cursor: pointer; }
  .pnl-edit button:hover { border-color: var(--blue); }
  .cp-body [data-panel].dragging { opacity: .35; }
  .cp-body [data-panel].sized { overflow: auto; }
  .pnl-rs { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .pnl-rs::after { content: ""; width: 54px; height: 5px; border-radius: 3px; background: var(--blue); }
  .cp-side { position: relative; }
  .col-rs { display: none; }
  .cp-body.editing .col-rs { display: flex; position: absolute; left: -13px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; z-index: 3; align-items: center; justify-content: center; touch-action: none; }
  .cp-body.editing .col-rs::after { content: ""; width: 5px; height: 64px; border-radius: 3px; background: var(--blue); }
  @media (max-width: 900px) { .cp-body.editing .col-rs { display: none; } }
  #cplock.on { color: var(--blue); border-color: var(--blue); }
  @media (max-width: 720px) { .layoutbar.show { bottom: 78px !important; } .layoutbar .lbtxt { display: none; } }
  .layoutbar { display: none; }
  .cp-body.editing ~ .layoutbar, .layoutbar.show { display: flex; position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 8; width: max-content; max-width: calc(100% - 24px);
    gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--blue); border-radius: 12px; padding: 8px 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .cp-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .cp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { background: none; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: var(--blue); color: #fff; }
  #cpchart { height: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
  #cpchart .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .cp-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .cp-box h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .cp-tabs { display: flex; gap: 6px; }
  .tlist { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tlist th { text-align: left; color: var(--faint); font-weight: 500; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tlist td { padding: 6px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; }
  .tlist td.r, .tlist th.r { text-align: right; }
  .tlist a { color: var(--muted); text-decoration: none; } .tlist a:hover { color: var(--text); }
  .tlist tr.buy td.side { color: var(--green); } .tlist tr.sell td.side { color: var(--red); }
  .tlwrap { overflow-x: auto; }
  .tag { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .4px; padding: 1px 5px; border-radius: 4px; margin-left: 4px;
         vertical-align: middle; text-transform: uppercase; }
  .tag.dev { background: rgba(236,57,122,.18); color: var(--red); } .tag.bundler { background: rgba(167,139,250,.18); color: var(--purple); }

<script>

  book: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/>',
  phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const AICON = { entry: "🟢", px: "💰", danger: "⚠️", grad: "🎓", test: "🧪", new: "🔔", track: "👁", friend: "👥" };
const NOTE_TAGS = { meme: "👍 good meme", rug: "🚩 rug", watch: "👀 watch", skip: "⏭ skip" };
const noteHtml = (n) => !n ? "" : `<div class="note">${n.tag ? `<span class="ntag">${NOTE_TAGS[n.tag]}</span>` : ""}${n.text ? `<span>${esc(n.text.slice(0, 140))}</span>` : ""}</div>`;
const ORDER = { entry: 0, bounce: 1, zone: 2, dip: 3, top: 4, dead: 5 };
const LABEL = { entry: "Entry", bounce: "Bounce", zone: "In zone", dip: "Dip", top: "Near top", dead: "Dead" };
const TABS = [["all", "Recommended"], ["watch", "★ Watchlist"], ["entry", "Entry"], ["bounce", "Bounce"], ["zone", "Zone"],
              ["dip", "Dip"], ["filtered", "Filtered out"], ["hidden", "Hidden by me"]];
const NEEDS_ALL = ["filtered", "hidden"];             // tabs that need the coins the filter hides
let tab = "all", soundOn = false, audio = null, lastAlert = null, state = null, token = null, userToken = null;
const AH = () => ({ "X-Sweden-Token": token || "", "X-Sweden-User": userToken || "" });   // passkey + account
const openDetails = new Set(), cardsSeen = new Set();
let focusMint = null, focusScroll = false;
let cardsReady = false;
try { token = localStorage.getItem("swedenToken"); userToken = localStorage.getItem("swedenUser"); tab = localStorage.getItem("swedenTab") || "all"; } catch (e) {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(x * 100 >= 10 ? 0 : d) + "%";
const usd = (x) => !x ? "–" : x >= 1e6 ? "$" + (x / 1e6).toFixed(2) + "M" : x >= 1e3 ? "$" + (x / 1e3).toFixed(1) + "K" : "$" + x.toFixed(0);
const dur = (m) => m < 1 ? "<1m" : m < 60 ? Math.round(m) + "m" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m";
const secs = (s) => s == null ? "–" : s < 60 ? Math.round(s) + "s" : dur(s / 60);
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : (u && /^ipfs:\/\//i.test(u) ? "https://ipfs.io/ipfs/" + u.slice(7) : "");
const xUrl = (t) => !t ? "" : /^https?:/i.test(t) ? t : "https://x.com/" + t.replace(/^@/, "");
const short = (m) => m.slice(0, 4) + "…" + m.slice(-4);

// ---------- chart ----------
function chart(c) {
  // p: [seconds since graduation, close, high, low] (mcap in SOL); log scale so a -80 % drop doesn't flatten the rest
  const p = c.pts; if (!p || p.length < 2) return '<div class="chartbox"><svg class="chart"></svg></div>';
  const W = 400, H = 190, L = Math.log, sol = state.sol_usd || 0;
  const x1 = p[p.length - 1][0] || 1;
  const ys = p.flatMap((q) => [q[2], q[3]]).concat([c.peak, c.low ?? c.peak]).filter((v) => v > 0);
  const y0 = L(Math.min(...ys)), y1 = L(Math.max(...ys));
  const X = (x) => (x / x1) * (W - 10) + 5, Y = (y) => H - 22 - ((L(y) - y0) / ((y1 - y0) || 1)) * (H - 44);
  const pt = (q, k) => X(q[0]).toFixed(1) + " " + Y(q[k]).toFixed(1);
  const line = p.map((q, i) => (i ? "L" : "M") + pt(q, 1)).join(" ");
  const band = p.map((q, i) => (i ? "L" : "M") + pt(q, 2)).join(" ") + " " + p.slice().reverse().map((q) => "L" + pt(q, 3)).join(" ") + " Z";
  const area = line + ` L${X(x1).toFixed(1)} ${H} L${X(p[0][0]).toFixed(1)} ${H} Z`;
  const col = getComputedStyle(document.documentElement).getPropertyValue("--" + c.stage).trim() || "#7d8396";
  const id = "g" + c.mint.slice(0, 8);
  const hl = (y, color) => `<line x1="0" x2="${W}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="${color}" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".7"/>`;
  const last = p[p.length - 1];
  return `<div class="chartbox" data-open="${esc(c.mint)}" title="Open the detailed chart"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${hl(c.peak, "#7d8396")}${c.low ? hl(c.low, "#ff8a3d") : ""}
    <path d="${area}" fill="url(#${id})"/>
    <path d="${band}" fill="${col}" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${col}"/>
  </svg>
  <span class="clabel tl">top ${usd(c.peak * sol)}</span>${c.low ? `<span class="clabel bl">low ${usd(c.low * sol)}</span>` : ""}
  <span class="clabel br">${dur(c.grad_min)} since graduation</span><span class="clabel tr">⤢ details</span></div>`;
}

// ---------- original of a copied coin (loaded when its details are opened) ----------
const origCache = new Map(), origPending = new Set();
function loadOrig(mint) {
  const hit = origCache.get(mint);
  if (origPending.has(mint) || (hit && Date.now() - hit.t < 60000)) return;
  origPending.add(mint);
  fetch("/api/original?mint=" + encodeURIComponent(mint), { headers: AH() })
    .then((r) => r.json()).then((d) => origCache.set(mint, { t: Date.now(), d }))
    .catch(() => origCache.set(mint, { t: Date.now(), d: { matches: [], chart: [], error: "no connection" } }))
    .finally(() => { origPending.delete(mint); render(); });
}
function lineChart(pts) {
  if (!pts || pts.length < 2) return "";
  const W = 400, H = 110, L = Math.log, ys = pts.map((q) => q[1]).filter((v) => v > 0);
  if (ys.length < 2) return "";
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0], y0 = L(Math.min(...ys)), y1 = L(Math.max(...ys));
  const X = (x) => ((x - x0) / ((x1 - x0) || 1)) * (W - 8) + 4, Y = (y) => H - 8 - ((L(Math.max(y, 1e-9)) - y0) / ((y1 - y0) || 1)) * (H - 16);
  const line = pts.map((q, i) => (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join(" ");
  return `<svg class="ochart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line} L${X(x1)} ${H} L${X(x0)} ${H} Z" fill="rgba(82,111,255,.15)"/>` +
    `<path d="${line}" fill="none" stroke="#526fff" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function origBlock(c) {
  if (openDetails.has(c.mint)) loadOrig(c.mint);
  const hit = origCache.get(c.mint);
  const head = `<div class="ot">Copy of ${c.copy_of} earlier coin${c.copy_of === 1 ? "" : "s"} that had already graduated (same name, or same ticker and similar name, last 72 h)</div>`;
  if (!hit) return `<div class="orig">${head}<div class="ot">Loading…</div></div>`;
  const d = hit.d, ms = d.matches || [];
  const rows = ms.map((o, i) => {
    const ax = "https://axiom.trade/meme/" + (o.pair || o.mint) + "?chain=sol";
    const ch = o.change24 == null ? "" : `<span>24h <b class="${o.change24 >= 0 ? "green" : "red"}">${o.change24 >= 0 ? "+" : ""}${o.change24.toFixed(0)}%</b></span>`;
    return `<div class="orow${i === 0 && o.mcap ? " top" : ""}"><span class="on">${esc(o.name || short(o.mint))} <small>$${esc(o.sym || "?")} · launched ${dur(o.launched_h * 60)} ago</small></span>
      <span class="ol"><button data-copy="${esc(o.mint)}">Copy CA</button><a href="${esc(ax)}" target="_blank" rel="noopener noreferrer">Axiom</a></span>
      <span class="ov num"><span>mcap <b>${usd(o.mcap)}</b></span><span>vol 24h <b>${usd(o.vol24)}</b></span><span>liq <b>${usd(o.liq)}</b></span>${ch}
      ${o.mcap == null ? "<span>not listed on DexScreener</span>" : ""}</span></div>`;
  }).join("");
  const top = ms[0];
  const chartHtml = d.chart && d.chart.length > 1 ? `<div class="ot">Chart of the biggest one ($${esc(top.sym || "?")}, mcap, 15-min, up to 3 days):</div>${lineChart(d.chart)}` : "";
  return `<div class="orig">${head}${d.error ? `<div class="ot red">${esc(d.error)}</div>` : ""}${rows}${chartHtml}</div>`;
}

// ---------- card ----------
function metric(icon, label, val, max, fmt = pct) {
  const cls = val == null ? "na" : max == null ? "" : val <= max ? "good" : "bad";
  return `<div class="m ${cls}" title="${esc(label)}${max != null ? " (limit " + fmt(max) + ")" : ""}"><div class="v num">${ic(icon)}${val == null ? "–" : fmt(val)}</div><div class="l">${label}</div></div>`;
}

function spark(c) {
  const p = c.pts; if (!p || p.length < 2) return "";
  const ys = p.map((q) => Math.log(Math.max(q[1], 1e-9))), y0 = Math.min(...ys), y1 = Math.max(...ys), x1 = p[p.length - 1][0] || 1;

// ---------- radar (built once, then updated in place so nothing restarts on refresh) ----------
const R_MAX = 100, R_MIN = 10, HOURS = 6;
const STATUS = { rec: "Recommended", watch: "Watchlist", waiting: "Passes checks, waiting for the dip", filtered: "Filtered out",
                 mayhem: "Mayhem", dead: "Dead (crashed)" };
const blips = new Map(), feedSeen = new Set();
let radarFirst = true;
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }
let radarMode = null;
function buildRadar(mode) {
  blips.clear(); radarFirst = true; radarMode = mode;
  const head = (title, sub) => `<div class="rtitle"><span class="dot live"></span><span id="rtitle">${title}</span></div>
      <div class="rsub">${sub}</div><div class="rstats num" id="rstats"></div>`;
  if (mode === "pulse") {
    $("#radar").innerHTML = `<div class="rinfo">${head("Live graduations", "Every pump.fun graduate of the last 6 h, newest first. Tap one to copy its CA.")}<div class="pfeed" id="feed"></div></div>`;
  } else if (mode === "grid") {
    $("#radar").innerHTML = `<div class="rinfo">${head("Heat grid", "One tile per graduate of the last 6 h, coloured by status, newest first. Tap a tile to copy its CA.")}<div class="hgrid" id="feed"></div></div>`;
  } else {
    const rings = [1, 2, 3, 4, 5, 6].map((h) => { const r = R_MIN + (h / HOURS) * (R_MAX - R_MIN);
      return `<circle class="ring${h === HOURS ? " outer" : ""}" r="${r}"/><text class="rlab" x="2" y="${-r + 7}">${h}h</text>`; }).join("");
    $("#radar").innerHTML = `<div class="rwrap"><svg viewBox="-104 -104 208 208" aria-hidden="true">
        <line class="ring" x1="-${R_MAX}" x2="${R_MAX}" y1="0" y2="0"/><line class="ring" y1="-${R_MAX}" y2="${R_MAX}" x1="0" x2="0"/>
        ${rings}<circle r="2" fill="var(--blue)"/><g id="blips"></g><g id="pings"></g></svg><div class="sweep"></div></div>
      <div class="rinfo">${head("Scanning graduates", `Every pump.fun graduate of the last ${HOURS} h. Centre = just graduated, each ring one more hour. Tap a row to copy its CA.`)}<div class="feed" id="feed"></div></div>`;
  }
}
const TILE = { rec: "var(--green)", watch: "var(--yellow)", waiting: "var(--cyan)", filtered: "var(--red)", mayhem: "var(--purple)", dead: "var(--faint)" };
const whyText = (r) => r.status === "waiting" ? "passes checks · waiting for the dip" : r.status === "rec" || r.status === "watch" ? STATUS[r.status] : r.why;
function updateRadar() {
  const el = $("#radar"), rec = state.coins.filter((c) => c.visible && !c.user_hidden).length;
  const mode = (state.settings || {}).radar_mode || "radar", hero = tab === "all" && rec === 0;
  el.hidden = mode === "off" || !(tab === "all" || tab === "watch");
  if (mode === "off" && tab === "all" && rec === 0 && !$("#grid").innerHTML)
    $("#grid").innerHTML = '<div class="empty">Nothing recommended right now. Waiting for graduates that dip…</div>';
  if (el.hidden) return;
  if (mode !== radarMode) buildRadar(mode);
  el.className = (hero ? "hero" : "compact") + " mode-" + mode;
  const rs = (state.radar || []).filter((r) => r.status !== "hidden");
  const n = (st) => rs.filter((r) => r.status === st).length;
  $("#rtitle").textContent = { radar: hero ? "Scanning graduates" : "Radar", pulse: "Live graduations", grid: "Heat grid" }[mode];
  const ht = state.heat, rt = document.querySelector("#radar .rinfo .rtitle");   // how busy pump.fun is right now
  if (ht && rt) {
    let el = $("#rheat");
    if (!el) { rt.insertAdjacentHTML("afterend", '<div class="wnote" id="rheat"></div>'); el = $("#rheat"); }
    el.textContent = `🔥 ${Math.round(ht.launches_h)} launches / h · ${ht.grads_h.toFixed(1)} graduations / h`;
    el.title = `pump.fun over the collector's last ${ht.hours.toFixed(1)} h`;
  }
  $("#rstats").innerHTML = [["waiting", "Waiting for dip", n("waiting")], ["filtered", "Filtered out", n("filtered")],
    ["mayhem", "Mayhem", n("mayhem")], ["dead", "Dead", n("dead")]]
    .map(([st, k, v]) => `<div class="rs"><div class="v">${v}</div><div class="k"><span class="lg c-${st}"></span>${k}</div></div>`).join("");
  const fresh = (m) => !radarFirst && !feedSeen.has(m);
  if (mode === "pulse") {
    const rows = rs.slice(0, hero ? 25 : 6);
    $("#feed").innerHTML = rows.length ? rows.map((r) => `<div class="prow${fresh(r.mint) ? " enter" : ""}" data-copy="${esc(r.mint)}">
        <span class="bar c-${r.status}"></span><span class="s">$${esc(r.sym)}<small>${esc(whyText(r))}</small></span>
        <span class="m num">${usd(r.mcap_usd)}</span><span class="t">${dur(r.grad_min)}</span></div>`).join("")
      : '<div class="ftitle">No graduations in the last hours</div>';
    rows.forEach((r) => feedSeen.add(r.mint));
  } else if (mode === "grid") {
    const tiles = hero ? rs : rs.slice(0, 24);
    $("#feed").innerHTML = tiles.map((r) => `<div class="tile${fresh(r.mint) ? " enter" : ""}" style="--tc:${TILE[r.status] || "var(--faint)"}" data-copy="${esc(r.mint)}" title="${esc(whyText(r))}">
        <b>$${esc(r.sym)}</b><span class="num">${usd(r.mcap_usd)} · ${dur(r.grad_min)}</span><span>${esc(STATUS[r.status] || r.status)}</span></div>`).join("")
      || '<div class="ftitle">No graduations in the last hours</div>';
    tiles.forEach((r) => feedSeen.add(r.mint));
  } else {
    // blips: create new ones (with a single ping), move existing ones, drop gone ones
    const g = $("#blips"), live = new Set();
    for (const r of rs) {
      live.add(r.mint);
      const rad = R_MIN + Math.min(r.grad_min / 60, HOURS) / HOURS * (R_MAX - R_MIN), a = hash(r.mint) * 2 * Math.PI;
      const x = (Math.cos(a) * rad).toFixed(1), y = (Math.sin(a) * rad).toFixed(1);
      let b = blips.get(r.mint);
      if (!b) {
        b = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b.setAttribute("r", r.status === "rec" || r.status === "watch" ? 3.4 : 2.4);
        g.appendChild(b); blips.set(r.mint, b);
        if (!radarFirst) {
          const pg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          pg.setAttribute("class", "ping"); pg.setAttribute("cx", x); pg.setAttribute("cy", y); pg.setAttribute("r", 2.4);
          $("#pings").appendChild(pg); setTimeout(() => pg.remove(), 1500);
        }
      }
      b.setAttribute("class", "blip " + r.status); b.setAttribute("cx", x); b.setAttribute("cy", y);
      b.innerHTML = `<title>${esc(r.sym)} · ${esc(STATUS[r.status] || r.status)}</title>`;
    }
    for (const [m, b] of blips) if (!live.has(m)) { b.remove(); blips.delete(m); }
    const recent = rs.slice(0, 8);
    $("#feed").innerHTML = recent.length ? '<div class="ftitle">Latest graduations</div>' + recent.map((r) =>
      `<div class="frow${fresh(r.mint) ? " enter" : ""}" data-copy="${esc(r.mint)}"><span class="lg c-${r.status}"></span>
        <span class="s">$${esc(r.sym)}<small>${usd(r.mcap_usd)}</small></span><span class="w">${esc(whyText(r))}</span><span class="t">${dur(r.grad_min)}</span></div>`).join("")
      : '<div class="ftitle">No graduations in the last hours</div>';
    recent.forEach((r) => feedSeen.add(r.mint));
  }
  radarFirst = false;
}

function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"), S = 128, k = Math.max(S / img.width, S / img.height);
      c.width = c.height = S;
      const w = img.width * k, h = img.height * k;
      c.getContext("2d").drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}

  if (!gaps) return `<span class="green">complete ✓</span>${fixed}`;
  return `<span class="${gaps > 5 ? "red" : "muted"}" title="trades the free feed missed (curve ${cb}, pool ${pb})">${gaps} gap${gaps === 1 ? "" : "s"}</span>${fixed}

  }

}

  const per = {}; cl.forEach((r) => { if (r.last) per[day(r.last)] = (per[day(r.last)] || 0) + r.pnl_sol; });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 34);
  while ((start.getDay() + 6) % 7) start.setDate(start.getDate() - 1);
  const maxAbs = Math.max(0.01, ...Object.values(per).map(Math.abs));
  let cells = "";
  for (let x = new Date(start); x <= today; x.setDate(x.getDate() + 1)) {
    const v = per[x.getFullYear() + "-" + (x.getMonth() + 1) + "-" + x.getDate()], a = v == null ? 0 : 0.15 + 0.6 * Math.abs(v) / maxAbs;
    const bg = v == null ? "" : `background:rgba(${v >= 0 ? "47,227,172" : "236,57,122"},${a.toFixed(2)})`;
    cells += `<div class="d${+x === +today ? " today" : ""}" style="${bg}" title="${x.toLocaleDateString()}${v != null ? ": " + (v >= 0 ? "+" : "") + v.toFixed(3) + " SOL" : ""}">${x.getDate()}${v != null ? `<b>${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(2)}</b>` : ""}</div>`;
  }
  $("#wpcal").innerHTML = `<div class="cal">${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((x) => `<div class="dh">${x}</div>`).join("")}${cells}</div>`;
}

function beep(kind) {

  const snd = (state && state.settings && state.settings.sound) || "chime";
  if (snd === "off") return;
  const notes = snd === "beep" ? [880] : snd === "alarm" ? [1200, 900, 1200, 900, 1200, 900] : kind === "entry" ? [660, 880, 1100] : [520, 660];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.18;
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.start(t); o.stop(t + 0.17);
  });
}

function handleAlerts() {
  const as = state.alerts;

  if (lastAlert === null) { lastAlert = maxId; return; }
  const fresh = as.filter((a) => a.id > lastAlert);
  lastAlert = Math.max(lastAlert, maxId);

}

  $("#sbody").onclick = (e) => { const b = e.target.closest("[data-untrack]"); if (b) trk(b.dataset.untrack, "", false); };
  $("#sdaily").onclick = async () => {
    try { const j = await (await fetch("/api/daily/preview", { method: "POST", headers: AH() })).json(); $("#sdailyout").textContent = j.text; $("#sdailyout").style.display = "block"; }
    catch (e) { toast("No connection", false); }
  };
  $("#slogout").onclick = () => { dropUser(); closeSettings(false); state = null; $("#grid").innerHTML = ""; $("#radar").hidden = true; showAccount("login"); };
  $("#sbody").querySelectorAll('input[type=color]').forEach((el) => el.oninput = () => { draft = readSettings(); styleKey = ""; applyStyle(draft); });
  $("#sbody").querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
    const [bg, panel, text, accent] = PRESETS[b.dataset.preset];
    Object.assign(draft, readSettings(), { bg, panel, text, accent });
    ["bg", "panel", "text", "accent"].forEach((k) => $("#s_" + k).value = draft[k]);
    styleKey = ""; applyStyle(draft);
  });
  $("#sbody").querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => {
    draft = Object.assign(readSettings(), { radar_mode: b.dataset.mode });
    $("#sbody").querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
  });
}
function closeSettings(restore = true) {
  $("#settings").classList.remove("show");
  if (restore && state) { styleKey = ""; applyStyle(state.settings); }   // preview not saved
}
$("#opensettings").onclick = openSettings;
$("#settings").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSettings(); });
$("#ssave").onclick = async () => {
  const st = readSettings();
  const addr = ($("#s_wallet")?.value || "").trim();
  if (addr !== ((state.wallet || {}).address || "")) {
    const rw = await fetch("/api/wallet/set", { method: "POST", headers: { "Content-Type": "application/json", ...AH() }, body: JSON.stringify({ address: addr }) });
    const jw = await rw.json();
    if (!jw.ok) return toast(jw.error || "Wallet not saved", false);
  }
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json", ...AH() }, body: JSON.stringify({ settings: st }) });
    if (r.status === 401) return on401(r);
    const j = await r.json();
    state.settings = j.settings; styleKey = ""; applyStyle(j.settings);
    closeSettings(false); toast("Settings saved"); tick();
  } catch (e) { toast("Not saved", false); }
};
$("#swhatif").onclick = async () => {                       // replay the (unsaved) settings over the coins in memory
  const st = readSettings();
  let box = $("#swhatifout");
  if (!box) { $("#sbody").insertAdjacentHTML("afterbegin", '<div class="sec" id="swhatifout"></div>'); box = $("#swhatifout"); }
  box.innerHTML = '<div class="wnote">Replaying…</div>'; $("#sbody").scrollTop = 0;
  try {
    const d = await (await fetch("/api/whatif", { method: "POST", headers: { "Content-Type": "application/json", ...AH() }, body: JSON.stringify({ settings: st }) })).json();
    box.innerHTML = `<h3>Test of these settings · last ~${d.hours} h · ${d.coins} graduates</h3>` + sigCard("Would have been recommended", d.summary.new) +
      sigCard("Entry signals", d.summary.entry) + `<div class="tlwrap" id="swhatiflist" style="margin-top:8px"></div>
      <div class="wnote" style="margin-top:6px">Raw market-cap moves after each signal (no fees, no delay), only the coins still in memory. A small sample: use it to compare settings, not as proof.</div>`;
    renderSignalRows(d.signals, "#swhatiflist");
  } catch (e) { box.innerHTML = '<div class="wnote red">Test failed</div>'; }
};
$("#sreset").onclick = () => {                              // the starting settings (your ntfy topic stays); Save to keep
  if (!state) return;
  openSettings(Object.assign({}, state.defaults, { ntfy_topic: readSettings().ntfy_topic }));
  styleKey = ""; applyStyle(draft);
};

let tickSeq = 0;
let frTimer = null;
async function tick() {
  if (!frTimer && userToken) { frTimer = setInterval(loadFriends, 60000); loadFriends(); }
  if (!token) return showLogin();
  if (!userToken) return showAccount();
  const all = NEEDS_ALL.includes(tab), my = ++tickSeq;
  try {
    const r = await fetch("/api/state" + (all ? "?all=1" : ""), { cache: "no-store", headers: AH() });
    if (r.status === 401) return on401(r);
    const fresh = await r.json();
    if (my !== tickSeq) return;                               // an older answer arriving late must not overwrite a newer one
    state = fresh;
    if (!$("#settings").classList.contains("show")) applyStyle(state.settings);
    $("#dot").className = "dot" + (state.live ? " live" : "");
    const n = state.coins.filter((c) => c.visible && !c.user_hidden).length;
    $("#status").innerHTML = (state.live ? "live" : "loading history…") + ` · ${n} shown<span class="long"> · SOL $${(state.sol_usd || 0).toFixed(2)} · ${new Date().toLocaleTimeString()}</span>`;
    handleAlerts(); render(); renderWalletChips(); markBnav();
  } catch (e) { $("#dot").className = "dot"; $("#status").textContent = "no connection to the terminal"; }
}

// ---------- actions ----------
function toast(text, ok = true) {
  const ts = $("#toast"); ts.textContent = text; ts.style.background = ok ? "var(--green)" : "var(--red)";
  ts.classList.add("show"); clearTimeout(ts._t); ts._t = setTimeout(() => ts.classList.remove("show"), 1600);
}
function copyCA(t, btn) {
  const done = () => {
    toast("CA copied: " + short(t));
    if (btn) { const old = btn.innerHTML; btn.classList.add("done"); btn.innerHTML = btn.id === "latestcopy" ? "Copied ✓" : "<span>Copied ✓</span>";
      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = old; }, 1400); }
  };
  const fallback = () => {                                   // plain http / older browsers
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    try { document.execCommand("copy"); done(); } catch (e) { prompt("Copy the CA:", t); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
/** coin page: hide the coin (no recommendations / alerts) and close the page */
function hideAndLeave() {
  const mint = cp.mint; if (!mint) return;
  setPref(mint, "hide");
  history.replaceState(null, "", location.pathname + location.search); route();   // no coin page left in the history
}
async function setPref(mint, action) {
  try {
    const r = await fetch("/api/prefs", { method: "POST", headers: { "Content-Type": "application/json", ...AH() },
                                          body: JSON.stringify({ mint, action }) });
    if (!r.ok) throw 0;
    toast({ watch: "Added to watchlist", unwatch: "Removed from watchlist", hide: "Hidden - no more alerts for it (tab \u201cHidden by me\u201d to undo)", unhide: "Shown again" }[action]);
    tick(); if (cp.mint) cpRefresh();
  } catch (e) { toast("Not saved", false); }
}

let axMint = null;
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; try { localStorage.setItem("swedenTab", tab); } catch (e) {} render(); tick(); return; }
  if (e.target.closest("[data-cphide]")) { hideAndLeave(); return; }
  const pf = e.target.closest("[data-pref]");
  if (pf) { setPref(pf.closest("[data-mint]").dataset.mint, pf.dataset.pref); return; }
  const ax = e.target.closest("[data-ax]");
  if (ax) { axMint = ax.dataset.ax; $("#axform").reset(); $("#axtitle").textContent = "What Axiom shows for $" + ax.dataset.sym + " right now";
            $("#ax").classList.add("show"); return; }
  const op = e.target.closest("[data-open]");
  if (op) { openCoin(op.dataset.open); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp && cp.dataset.copy) copyCA(cp.dataset.copy, cp.dataset.big || cp.id === "latestcopy" ? cp : cp.closest(".card")?.querySelector("[data-big]"));
});
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.d) return;
  if (d.open) { openDetails.add(d.dataset.d); if (!origCache.has(d.dataset.d) && d.querySelector(".orig")) loadOrig(d.dataset.d); }
  else openDetails.delete(d.dataset.d);
}, true);

$("#loginform").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passkey: $("#pk").value }) });
    const j = await r.json();
    if (r.ok && j.token) {
      token = j.token; try { localStorage.setItem("swedenToken", token); } catch (e) {}
      $("#pk").value = ""; $("#login").classList.remove("show"); userToken ? tick() : showAccount("login");
    } else showLogin(j.error === "locked" ? `Too many wrong tries - wait ${j.wait} s` : "Wrong passkey" + (j.wait ? ` - locked for ${j.wait} s` : ""));
  } catch (e) { showLogin("No connection to the terminal"); }
};
$("#lock").innerHTML = ic("lock");
$("#opensettings").innerHTML = ic("gear");
$("#lock").onclick = () => { dropToken(); dropUser(); state = null; radarMode = null; $("#grid").innerHTML = ""; $("#radar").hidden = true; $("#log").innerHTML = ""; $("#latest").classList.remove("show"); renderTabs(); showLogin(); };
const soundLabel = () => { $("#sound").innerHTML = ic(soundOn ? "bell" : "belloff") + `<span>${soundOn ? "Sound on" : "Sound off"}</span>`; $("#sound").classList.toggle("on", soundOn); };
$("#sound").onclick = () => {
  soundOn = !soundOn;
  if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  soundLabel(); if (soundOn) beep("new");
};
$("#testpush").innerHTML = ic("phone") + "<span>Test push</span>";
$("#testpush").onclick = async () => {
  try {
    const r = await fetch("/api/testpush", { method: "POST", headers: AH() });
    const j = await r.json(); toast(j.msg || "failed", !!j.ok); tick();
  } catch (e) { toast("No connection", false); }
};
$("#search .si").innerHTML = ic("search");
$("#pasteca").innerHTML = ic("paste") + "<span>Paste CA</span>";
$("#pasteca").onclick = pasteFromClipboard;
$("#opensignals").innerHTML = ic("signal") + "<span>Signals</span>";
$("#opensignals").onclick = () => { location.hash = "#signals"; };
$("#openjournal").innerHTML = ic("book") + "<span>Journal</span>";
$("#openfriends").innerHTML = ic("users") + "<span>Friends</span>";
$("#openfriends").onclick = () => { location.hash = "#friends"; };
$("#openrecent").innerHTML = ic("clock"); $("#openrecent").onclick = showRecent;
$("#q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); $("#search").classList.toggle("has", !!query); render(); });
$("#qclear").onclick = () => { $("#q").value = ""; query = ""; $("#search").classList.remove("has"); render(); $("#q").focus(); };
$("#axcancel").onclick = () => $("#ax").classList.remove("show");
$("#axform").onsubmit = async (e) => {
  e.preventDefault();
  const values = {}; new FormData(e.target).forEach((v, k) => { v = String(v).replace(",", ".").replace("%", "").trim(); if (v) values[k] = v; });
  try {
    const r = await fetch("/api/axiom", { method: "POST", headers: { "Content-Type": "application/json", ...AH() },
                                          body: JSON.stringify({ mint: axMint, values }) });
    toast(r.ok ? "Saved - thanks" : "Not saved (empty or coin gone)", r.ok);
  } catch (err) { toast("No connection", false); }
  $("#ax").classList.remove("show");
};
const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
soundLabel(); renderTabs(); setHH(); addEventListener("resize", setHH);
tick(); setInterval(tick, 3000); route();
</script>
